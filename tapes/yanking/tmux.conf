set -g status off          # no green status bar in the video
set -sg escape-time 0      # otherwise Esc in bible-tui lags
set -g default-terminal tmux-256color
# The left pane is an empty shell; the tape starts bible-tui on camera (and later quits it to edit its
# config). nvim's settings come from setup.sh's sandbox HOME.
new-session -s yank
split-window -h "nvim notes.md"
select-pane -L             # start focused on the left pane
# The session starts at 80 columns, and tmux doesn't keep percentages when it grows to the real terminal,
# so size the notes pane after attaching (and on any later resize).
set-hook -g client-attached "resize-pane -t yank:.1 -x 15%"
set-hook -g client-resized "resize-pane -t yank:.1 -x 15%"
