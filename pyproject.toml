[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-tui"
dynamic = ["version"]
description = "A dependency-free terminal Bible reader with Vim-style navigation and pluggable versions"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cody Sechelski" }]
keywords = ["bible", "scripture", "terminal", "tui", "curses", "vim", "kjv", "reader"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Religion",
]

[project.urls]
Homepage = "https://github.com/codysechelski/bible-tui"
Documentation = "https://github.com/codysechelski/bible-tui/blob/main/docs/features/index.md"
Issues = "https://github.com/codysechelski/bible-tui/issues"
Changelog = "https://github.com/codysechelski/bible-tui/blob/main/CHANGELOG.md"

[project.scripts]
bible-tui = "bible_tui.cli:main"

[tool.setuptools]
packages = ["bible_tui", "bible_tui.bibles"]

[tool.setuptools.package-data]
"bible_tui.bibles" = ["*.sqlite"]

[tool.setuptools.dynamic]
version = { attr = "bible_tui.__version__" }

[tool.semantic_release]
version_variables = ["bible_tui/__init__.py:__version__"]
tag_format = "v{version}"
commit_parser = "conventional"
commit_message = "chore(release): {version}"
# Stay on 0.x until we choose to cut 1.0.0: a breaking change bumps the minor version.
allow_zero_version = true
major_on_zero = false
# The release workflow builds and publishes to PyPI in its own jobs, from the new tag.
build_command = ""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = ['''^chore\(release\):''']
