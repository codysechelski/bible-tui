name: Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Whether anything besides docs changed. Docs-only changes skip the test matrix (and its slow-to-start
  # macOS runner), but the workflow itself always runs, so the required `tests` check always reports.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          DOCS: '(\.md$|^docs/|^tapes/|^\.github/ISSUE_TEMPLATE/|^LICENSE$)'
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...$PR_HEAD"  # only what the pull request changes
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          # When the range can't be read, test to be safe.
          if ! changed="$(git diff --name-only "$range")"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qvE "$DOCS"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed; skipping the tests."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Ubuntu; macOS (curses, termios, pbcopy, Homebrew) on the newest only,
        # since macOS runners are slow to start.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile bible_tui/*.py tests/*.py
      - name: Tests
        run: python -m unittest discover -s tests -t .

  # The one check the main ruleset requires: it passes when the matrix passed or was skipped for a docs-only
  # change, and fails otherwise. Its name stays the same when the matrix changes.
  tests:
    needs: [changes, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes: $CHANGES, test: $TEST"
          [ "$CHANGES" = success ] && { [ "$TEST" = success ] || [ "$TEST" = skipped ]; }

  # The `!cancelled()` checks below keep a skipped test matrix (a docs-only push) from skipping these jobs too.
  release:
    needs: tests
    if: ${{ !cancelled() && needs.tests.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # Release exactly the commit that was tested, even if main moved on.
      - name: Pin to the workflow commit
        run: git reset --hard ${{ github.sha }}

      - name: Semantic release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com

  # Build from the new tag, then publish in a separate job so only the upload step can mint a PyPI token.
  # If publishing fails, "Re-run failed jobs" retries it without cutting another release.
  build:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # PyPI keeps each release's README for good, so its images and links must point at this release's tag,
      # not at main, where files get moved or deleted later.
      - name: Point the README's GitHub links at the release tag
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          sed -i -E "s#(raw\.githubusercontent\.com/codysechelski/bible-tui|github\.com/codysechelski/bible-tui/blob)/main/#\1/${TAG}/#g" README.md
          ! grep -n -E "codysechelski/bible-tui(/blob)?/main/" README.md
      - name: Build the sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bible-tui/
    permissions:
      id-token: write # PyPI trusted publishing; no API token is stored.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
